# Building .deb package for LTS for jags

name: deb

on:
  push:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-26.04

    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Dependencies
        run: |
          sudo apt update -qq
          sudo apt upgrade -y --no-install-recommends
          sudo apt install debhelper-compat (= 13) gfortran-for-host liblapack-dev libltdl-dev texlive-base texlive-latex-base texlive-plain-generic texlive-fonts-recommended texlive-extra-utils texlive-latex-recommended texlive-latex-extra texinfo faketime g++-for-host libcppunit-dev pkgconf
        # commented out: mercurial

      - name: Build
        run: |
          dpkg-buildpackage -us -uc -tc -rfakeroot
