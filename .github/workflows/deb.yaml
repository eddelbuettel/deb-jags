# Building .deb package for LTS for jags

name: deb

on:
  push:
  workflow_dispatch:

jobs:
  build:

    strategy:
      fail-fast: false
      matrix:
        config:
          # { ver: '24.04', tag: 'focal',    cpu: 'amd64', runs: 'ubuntu-24.04' }
          - { ver: '24.04', tag: 'focal',    cpu: 'amd64', runs: 'ubuntu-24.04' }
          - { ver: '24.04', tag: 'focal',    cpu: 'arm64', runs: 'ubuntu-24.04-arm' }
          - { ver: '26.04', tag: 'resolute', cpu: 'amd64', runs: 'ubuntu-26.04' }
          - { ver: '26.04', tag: 'resolute', cpu: 'arm64', runs: 'ubuntu-26.04-arm' }
      
    runs-on: ${{ matrix.config.runs }}

    permissions:
      contents: write
      
    steps:

      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: pkg

      - name: Versions
        run: |
          cd pkg
          echo "PKG=$(dpkg-parsechangelog -S Source)" >> $GITHUB_ENV
          echo "DIST=$(dpkg-parsechangelog -S Distribution)" >> $GITHUB_ENV
          echo "DEBVER=$(dpkg-parsechangelog -S Version)" >> $GITHUB_ENV
          echo "VER=$(dpkg-parsechangelog -S Version | sed -e 's/-[^-]*$//' -e 's/^[0-9]*://')" >> $GITHUB_ENV
          echo "ARCH=$(dpkg-architecture -qDEB_BUILD_ARCH)" >> $GITHUB_ENV
          echo "EMAIL=edd@debian.org" >> $GITHUB_ENV
          
      - name: Update
        run: sudo apt update -qq

      - name: Upgrade
        run: sudo apt upgrade -y --no-install-recommends
        
      - name: Devscripts
        run: sudo apt install -y --no-install-recommends devscripts

      - name: Dependencies 
        run: cd pkg && sudo apt build-dep --no-install-recommends .

      - name: Tarball
        run: cd pkg && tar cvzf ../${PKG}_${VER}.orig.tar.gz --exclude='.git*' --exclude='debian' .

      - name: Changelog
        run: cd pkg && dch --package ${PKG} --newversion "${DEBVER}.${{ matrix.config.ver }}.1" --distribution "${{ matrix.config.tag }}" "Backport to ${{ matrix.config.ver }}"
        
      - name: Build
        run: cd pkg && rm -rf .github && dpkg-buildpackage -us -uc -tc -rfakeroot -i -I

      - name: Move
        run: mkdir -p repo/${DIST} && mv -v ${PKG}_${DEBVER}.${{ matrix.config.ver }}.1_${ARCH}.deb repo/${DIST}

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: repo/*/*.deb
          make_latest: true
          prerelease: true
          tag_name: latest
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_GITHUB }}
