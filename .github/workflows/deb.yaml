# Building .deb package for LTS for jags

name: deb

on:
  push:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-26.04

    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Update
        run: sudo apt update -qq

      - name: Upgrade
        run: sudo apt upgrade -y --no-install-recommends
        
      - name: Dependencies 
        run: sudo apt install --no-install-recommends build-essential debhelper gfortran-for-host liblapack-dev libltdl-dev texlive-base texlive-latex-base texlive-plain-generic texlive-fonts-recommended texlive-extra-utils texlive-latex-recommended texlive-latex-extra texinfo faketime g++-for-host libcppunit-dev pkgconf mercurial

      - name: Tarball
        run: tar cvzf ../jags_5.0.2.orig.tar.gz --exclude='.git*' --exclude='debian' .

      - name: Build
        run: dpkg-buildpackage -us -uc -tc -rfakeroot
        
        
