# Building .deb package for LTS for jags

name: deb

on:
  push:
  workflow_dispatch:

jobs:
  build:

    strategy:
      fail-fast: false
      matrix:
        config:
          - { ver: '24.04', tag: 'focal',    cpu: 'amd64', runs: 'ubuntu-24.04' }
          - { ver: '26.04', tag: 'resolute', cpu: 'amd64', runs: 'ubuntu-26.04' }
      
    runs-on: ${{ matrix.config.runs }}
    
    steps:

      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: jags

      - name: Versions
        run: |
          cd jags
          echo "PKG=$(dpkg-parsechangelog -S Source)" >> $GITHUB_ENV
          echo "DIST=$(dpkg-parsechangelog -S Distribution)" >> $GITHUB_ENV
          echo "DEBVER=$(dpkg-parsechangelog -S Version)" >> $GITHUB_ENV
          echo "VER=$(dpkg-parsechangelog -S Version | sed -e 's/-[^-]*$//' -e 's/^[0-9]*://')" >> $GITHUB_ENV
          echo "ARCH=$(dpkg-architecture -qDEB_BUILD_ARCH)" >> $GITHUB_ENV
          echo "EMAIL=edd@debian.org" >> $GITHUB_ENV
          
      - name: Update
        run: sudo apt update -qq

      - name: Upgrade
        run: sudo apt upgrade -y --no-install-recommends
        
      - name: Dependencies 
        run: sudo apt install --no-install-recommends build-essential debhelper gfortran-for-host liblapack-dev libltdl-dev texlive-base texlive-latex-base texlive-plain-generic texlive-fonts-recommended texlive-extra-utils texlive-latex-recommended texlive-latex-extra texinfo faketime g++-for-host libcppunit-dev pkgconf mercurial

      - name: Tarball
        run: cd jags && tar cvzf ../${PKG}_${VER}.orig.tar.gz --exclude='.git*' --exclude='debian' .

      - name: Changelog
        run: cd jags && dch --package ${PKG} --newversion "${DEBVER}.${{ matrix.config.ver }}" --distribution "${{ matrix.config.tag }}" "Backport to ${{ matrix.config.ver }}"
        
      - name: Build
        run: cd jags && rm -rf .github && dpkg-buildpackage -us -uc -tc -rfakeroot -i -I

      - name: Move
        run: mkdir -p ${DIST} && mv -v ${PKG}_${DEBVER}_${ARCH}.deb ${DIST}
        
